name: correctness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: correctness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          swift --version
          sw_vers
      - name: Debug numerical tests
        run: swift test --disable-xctest
      - name: Release numerical tests
        run: swift test -c release --disable-xctest
      - name: Build release CLI
        run: swift build -c release
      - name: Device information
        run: .build/release/heatflow info
      - name: CLI contracts
        run: python3 scripts/check_cli.py
      - name: Recorded benchmark and demo invariants
        run: python3 scripts/verify_artifacts.py
